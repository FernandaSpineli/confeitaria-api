services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: confeitaria
      POSTGRES_USER: ${DB_USER:-confeitaria}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-confeitaria}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/confeitaria
      DB_USER: ${DB_USER:-confeitaria}
      DB_PASSWORD: ${DB_PASSWORD:-confeitaria}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no arquivo .env (mínimo 32 caracteres)}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"

volumes:
  pgdata:
