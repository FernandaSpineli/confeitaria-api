spring:
  application:
    name: confeitaria-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/confeitaria}
    username: ${DB_USER:confeitaria}
    password: ${DB_PASSWORD:confeitaria}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  mvc:
    problemdetails:
      enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: confeitaria-api
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:7d}
  admin:
    email: ${APP_ADMIN_EMAIL:}
    password: ${APP_ADMIN_PASSWORD:}
  # Conta de demonstração com a torta holandesa em 3 tamanhos (desligada por padrão).
  demo:
    enabled: ${APP_DEMO_ENABLED:false}
    email: ${APP_DEMO_EMAIL:demo@exemplo.com}
    password: ${APP_DEMO_PASSWORD:senha12345}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true

management:
  endpoints:
    web:
      exposure:
        include: health
